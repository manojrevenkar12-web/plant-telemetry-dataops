[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-telemetry-dataops"
version = "1.0.0"
description = "Factory-floor data for AI: edge gateway with store-and-forward, Kafka/Event Hubs streaming, Delta bronze/silver/gold, batch reconciliation, data contracts, data quality, lineage, REST + GraphQL APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "pydantic>=2.8",
  "jsonschema>=4.22",
  "pyarrow>=16",
  "deltalake>=0.25",
  "polars>=1.0",
  "confluent-kafka>=2.5",
  "amqtt>=0.11",
  "great-expectations>=1.3",
  "openlineage-python>=1.20",
  "fastapi>=0.115",
  "strawberry-graphql>=0.240",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
telemetry = "telemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telemetry = ["contracts/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["kafka: needs a real Kafka broker (KAFKA_BOOTSTRAP)"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
